<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f6fa; color: #1a1a2e; font-size: 14px; }
    .view { display: none; padding: 20px 24px 100px; }
    .view.active { display: block; }

    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: #fff; border-bottom: 1px solid #e2e4ef; position: sticky; top: 0; z-index: 10; }
    .topbar-title { font-size: 16px; font-weight: 700; color: #1a1a2e; }
    .topbar-right { display: flex; gap: 8px; align-items: center; }
    .user-chip { display: flex; align-items: center; gap: 7px; background: #f0f2fa; border-radius: 20px; padding: 4px 12px 4px 8px; font-size: 12px; }
    .user-avatar { width: 22px; height: 22px; border-radius: 50%; background: #4361ee; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
    .user-chip-name { font-weight: 600; color: #1a1a2e; }
    .user-chip-role { color: #888; font-size: 11px; }

    .btn { padding: 7px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #d0d3e0; background: #fff; color: #1a1a2e; transition: background 0.15s; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover:not(:disabled) { background: #f0f2fa; }
    .btn:disabled { opacity: 0.45; cursor: default; pointer-events: none; }
    .btn-primary { background: #4361ee; color: #fff; border-color: #4361ee; }
    .btn-primary:hover:not(:disabled) { background: #2f4bcc; }
    .btn-success { background: #1e8a4a; color: #fff; border-color: #1e8a4a; }
    .btn-success:hover:not(:disabled) { background: #166b39; }
    .btn-warning { background: #fff; color: #c07000; border-color: #c07000; }
    .btn-warning:hover:not(:disabled) { background: #fff8ee; }
    .btn-danger  { background: #fff; color: #c0392b; border-color: #c0392b; }
    .btn-danger:hover:not(:disabled)  { background: #fdecea; }
    .btn-ghost { background: none; border: none; color: #4361ee; font-weight: 600; font-size: 13px; cursor: pointer; padding: 7px 4px; }
    .btn-ghost:hover { text-decoration: underline; }
    .btn-sm { padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid #d0d3e0; background: #fff; display: inline-flex; align-items: center; gap: 4px; }
    .btn-sm-primary { border-color: #4361ee; color: #4361ee; }
    .btn-sm-primary:hover { background: #eef0fd; }
    .btn-sm-success { border-color: #1e8a4a; color: #1e8a4a; }
    .btn-sm-success:hover { background: #edfaf3; }
    .btn-sm-danger  { border-color: #c0392b; color: #c0392b; }
    .btn-sm-danger:hover  { background: #fdecea; }
    .btn-sm-warning { border-color: #c07000; color: #c07000; }
    .btn-sm-warning:hover { background: #fff8ee; }

    .spinner { width: 13px; height: 13px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; display: none; flex-shrink: 0; }
    .btn-danger .spinner, .btn-warning .spinner { border-color: rgba(0,0,0,0.2); border-top-color: currentColor; }
    .btn.loading .spinner { display: inline-block; }
    .btn.loading .btn-label { opacity: 0.7; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .proc-bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: #4361ee; z-index: 999; transform: scaleX(0); transform-origin: left; transition: transform 0.3s ease; }
    .proc-bar.active { transform: scaleX(0.85); }
    .proc-bar.done   { transform: scaleX(1); transition: transform 0.15s ease; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 6px; font-size: 13px; font-weight: 600; z-index: 998; display: none; white-space: nowrap; pointer-events: none; }
    .toast-info    { background: #e8ecfd; color: #2f4bcc; border: 1px solid #c5cdf9; }
    .toast-success { background: #d1f2e1; color: #0f5132; border: 1px solid #a3cfbb; }
    .toast-error   { background: #f8d7da; color: #842029; border: 1px solid #f1aeb5; }

    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge-active            { background: #d1f2e1; color: #0f5132; }
    .badge-inprogress        { background: #e8ecfd; color: #2f4bcc; }
    .badge-completed         { background: #1e8a4a; color: #fff; }
    .badge-needsassignment   { background: #fff3cd; color: #856404; }
    .badge-pending           { background: #f5f6fa; color: #888; border: 1px solid #d0d3e0; }
    .badge-uploaded          { background: #fff3cd; color: #856404; }
    .badge-adminapproved     { background: #d1f2e1; color: #0f5132; }
    .badge-adminrejected     { background: #f8d7da; color: #842029; }
    .badge-clientrejected    { background: #fdecea; color: #c0392b; }
    .badge-delivered         { background: #1e8a4a; color: #fff; }

    .list-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .list-count { font-size: 13px; color: #666; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #e2e4ef; }
    thead th { background: #4361ee; color: #fff; padding: 10px 12px; text-align: left; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
    tbody tr:nth-child(odd)  { background: #fff; }
    tbody tr:nth-child(even) { background: #f8f9ff; }
    tbody tr:hover { background: #eef0fd; cursor: pointer; }
    tbody td { padding: 10px 12px; border-bottom: 1px solid #e2e4ef; vertical-align: middle; }
    .col-id { width: 90px; font-weight: 700; color: #4361ee; }
    .col-status { width: 150px; }
    .col-date   { width: 110px; color: #666; }
    .col-acts   { width: 90px; text-align: right; }

    .assign-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; background: #fff3cd; color: #856404; border: 1px solid #f0d090; margin-left: 6px; }
    .assign-chip.full { background: #d1f2e1; color: #0f5132; border-color: #a3cfbb; }

    .filter-tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-tab { padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid #d0d3e0; background: #fff; color: #888; transition: all 0.15s; }
    .filter-tab.active { background: #4361ee; color: #fff; border-color: #4361ee; }
    .filter-tab:hover:not(.active) { background: #f0f2fa; color: #4361ee; }

    .section { background: #fff; border-radius: 8px; padding: 16px 18px; margin-bottom: 14px; border: 1px solid #e2e4ef; }
    h3 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #4361ee; margin-bottom: 12px; }
    .meta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .meta-cell { font-size: 12px; }
    .meta-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #888; margin-bottom: 3px; }
    .meta-value { color: #1a1a2e; font-weight: 600; }

    .item-card { background: #fff; border: 1px solid #e2e4ef; border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; transition: box-shadow 0.15s; }
    .item-card:hover { box-shadow: 0 2px 8px rgba(67,97,238,0.10); }
    .item-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .item-name { font-weight: 700; font-size: 14px; color: #1a1a2e; }
    .item-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; margin-bottom: 10px; align-items: flex-start; }
    .meta-pill { background: #f0f2fa; border-radius: 5px; padding: 4px 10px; font-size: 12px; color: #444; line-height: 1.45; }
    .meta-pill .pill-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #888; display: block; margin-bottom: 1px; }
    .meta-pill .pill-value { font-weight: 600; color: #1a1a2e; }
    .meta-pill.notes-pill { background: #fffbea; border: 1px solid #f0e0a0; flex: 1; min-width: 180px; }
    .meta-pill.notes-pill .pill-label { color: #a07000; }
    .meta-pill.notes-pill .pill-value { font-weight: 400; color: #5a4500; }
    .item-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; }

    .upload-area { width: 100%; margin-top: 10px; }
    .upload-zone { border: 2px dashed #d0d3e0; border-radius: 6px; padding: 16px; text-align: center; background: #f8f9ff; cursor: pointer; transition: border-color 0.2s, background 0.2s; font-size: 12px; color: #888; }
    .upload-zone:hover, .upload-zone.drag-over { border-color: #4361ee; background: #eef0fd; color: #4361ee; }
    .upload-zone input[type="file"] { display: none; }
    .upload-zone-icon { font-size: 22px; margin-bottom: 6px; display: block; }
    .upload-zone-hint { font-size: 11px; color: #aaa; margin-top: 4px; }
    .upload-trigger-btns { display: flex; gap: 8px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
    .upload-trigger-btn { padding: 5px 14px; border-radius: 5px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid #4361ee; background: #fff; color: #4361ee; }
    .upload-trigger-btn:hover { background: #eef0fd; }
    .qty-requirement { font-size: 12px; font-weight: 600; color: #4361ee; margin-bottom: 8px; padding: 6px 10px; background: #eef0fd; border-radius: 5px; border-left: 3px solid #4361ee; }
    .qty-requirement.met  { color: #0f5132; background: #d1f2e1; border-left-color: #1e8a4a; }
    .qty-requirement.over { color: #842029; background: #f8d7da; border-left-color: #c0392b; }
    .file-queue { margin-top: 10px; border: 1px solid #e2e4ef; border-radius: 6px; overflow: hidden; display: none; }
    .file-queue.has-files { display: block; }
    .file-queue-header { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; background: #f0f2fa; font-size: 11px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 0.04em; }
    .file-queue-clear { background: none; border: none; color: #c0392b; font-size: 11px; font-weight: 600; cursor: pointer; }
    .file-queue-list { max-height: 160px; overflow-y: auto; }
    .file-queue-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; font-size: 12px; border-bottom: 1px solid #f0f2fa; }
    .file-queue-item:last-child { border-bottom: none; }
    .file-queue-name { color: #1a1a2e; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-queue-size { color: #888; font-size: 11px; margin-left: 8px; flex-shrink: 0; }
    .file-queue-remove { background: none; border: none; color: #c0392b; cursor: pointer; font-size: 13px; padding: 0 0 0 8px; }
    .upload-submit-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    .upload-count-label { font-size: 12px; color: #1e8a4a; font-weight: 600; }
    .upload-progress-wrap { margin-top: 8px; display: none; }
    .upload-progress-wrap.active { display: block; }
    .upload-progress-bar-bg { background: #e8eaf0; border-radius: 4px; height: 5px; overflow: hidden; }
    .upload-progress-bar-fill { height: 100%; background: #4361ee; border-radius: 4px; transition: width 0.2s ease; }
    .upload-progress-label { font-size: 11px; color: #666; margin-top: 3px; }
    .progress-bar-wrap { background: #e8eaf0; border-radius: 4px; height: 6px; margin-top: 8px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: #1e8a4a; border-radius: 4px; transition: width 0.4s ease; }
    .progress-label { font-size: 11px; color: #888; margin-top: 4px; text-align: right; }

    .form-actions { display: flex; gap: 8px; align-items: center; padding: 12px 24px; background: #fff; border-top: 1px solid #e2e4ef; position: fixed; bottom: 0; left: 0; right: 0; z-index: 9; }
    .spacer { flex: 1; }
    .deliverables-btn { display: inline-flex; align-items: center; gap: 6px; color: #1e8a4a; font-size: 13px; font-weight: 600; text-decoration: none; padding: 6px 14px; border: 1px solid #1e8a4a; border-radius: 5px; }
    .deliverables-btn:hover { background: #edfaf3; }

    /* ── REVIEW DIALOG ── */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 20px; }
    .overlay.open { display: flex; }

    .review-dialog { background: #fff; border-radius: 12px; width: 100%; max-width: 800px; margin: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.25); display: flex; flex-direction: column; overflow: hidden; }
    .review-dialog-header { padding: 16px 20px; border-bottom: 1px solid #e2e4ef; display: flex; align-items: center; justify-content: space-between; }
    .review-dialog-header h4 { font-size: 15px; font-weight: 700; color: #1a1a2e; }
    .review-dialog-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #888; padding: 0 4px; line-height: 1; }
    .review-dialog-close:hover { color: #1a1a2e; }

    /* Select-all bar */
    .gallery-controls { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; background: #f8f9ff; border-bottom: 1px solid #e2e4ef; }
    .gallery-controls-left { display: flex; align-items: center; gap: 10px; }
    .select-all-wrap { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .select-all-wrap input[type="checkbox"] { width: 15px; height: 15px; accent-color: #4361ee; cursor: pointer; }
    .select-all-label { font-size: 12px; font-weight: 700; color: #4361ee; }
    .selected-count-chip { font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 20px; background: #e8ecfd; color: #2f4bcc; }
    .selected-count-chip.none { background: #f0f2fa; color: #888; }

    /* Gallery */
    .gallery-wrap { padding: 16px 20px; background: #f5f6fa; border-bottom: 1px solid #e2e4ef; min-height: 80px; max-height: 420px; overflow-y: auto; }
    .gallery-loading { text-align: center; color: #888; font-size: 13px; padding: 20px; }
    .gallery-empty   { text-align: center; color: #aaa; font-size: 13px; padding: 20px; }

    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }

    /* Gallery item with checkbox */
    .gallery-item { background: #fff; border: 2px solid #e2e4ef; border-radius: 8px; overflow: hidden; cursor: pointer; transition: box-shadow 0.15s, border-color 0.15s; position: relative; }
    .gallery-item:hover { box-shadow: 0 2px 10px rgba(67,97,238,0.18); border-color: #4361ee; }
    .gallery-item.selected { border-color: #4361ee; box-shadow: 0 0 0 2px rgba(67,97,238,0.25); }
    .gallery-item.selected .gallery-check { background: #4361ee; border-color: #4361ee; }
    .gallery-item.selected .gallery-check::after { display: block; }

    /* Checkbox overlay on card */
    .gallery-check-wrap { position: absolute; top: 7px; left: 7px; z-index: 2; }
    .gallery-check {
      width: 20px; height: 20px; border-radius: 4px; border: 2px solid #d0d3e0;
      background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .gallery-check::after {
      content: ''; display: none; width: 5px; height: 9px;
      border: 2px solid #fff; border-top: none; border-left: none;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    .gallery-thumb { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: #f0f2fa; }
    .gallery-thumb-placeholder { width: 100%; aspect-ratio: 4/3; background: #f0f2fa; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #c0c0c0; }
    .gallery-item-info { padding: 6px 8px; }
    .gallery-item-name { font-size: 11px; color: #555; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gallery-item-type { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 1px; }
    .gallery-item-open { display: block; font-size: 11px; color: #4361ee; font-weight: 600; text-decoration: none; margin-top: 3px; }
    .gallery-item-open:hover { text-decoration: underline; }

    .gallery-item.is-video .gallery-thumb-placeholder { background: #1a1a2e; color: #fff; flex-direction: column; gap: 6px; font-size: 28px; }

    /* Review footer */
    .review-dialog-footer { padding: 14px 20px; display: flex; flex-direction: column; gap: 10px; }
    .review-notes-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin-bottom: 4px; }
    textarea.review-notes { width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid #d0d3e0; border-radius: 5px; font-family: inherit; resize: vertical; min-height: 56px; }
    textarea.review-notes:focus { outline: none; border-color: #4361ee; }
    .review-btn-row { display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }

    /* Info banner inside footer */
    .review-info-banner { font-size: 12px; padding: 8px 12px; border-radius: 5px; border-left: 3px solid; }
    .review-info-banner.approve { background: #edfaf3; border-color: #1e8a4a; color: #0f5132; }
    .review-info-banner.reject  { background: #fff3cd; border-color: #c07000; color: #7a4500; }

    /* Lightbox */
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 300; align-items: center; justify-content: center; }
    .lightbox.open { display: flex; }
    .lightbox-img { max-width: 90vw; max-height: 88vh; object-fit: contain; border-radius: 4px; box-shadow: 0 4px 32px rgba(0,0,0,0.5); }
    .lightbox-close { position: fixed; top: 16px; right: 20px; background: rgba(255,255,255,0.15); border: none; color: #fff; font-size: 24px; cursor: pointer; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
    .lightbox-close:hover { background: rgba(255,255,255,0.3); }
    .lightbox-caption { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: #fff; font-size: 12px; padding: 6px 14px; border-radius: 20px; white-space: nowrap; }

    .file-link { font-size: 12px; color: #4361ee; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
    .file-link:hover { text-decoration: underline; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="proc-bar" id="procBar"></div>
<div class="toast"    id="toast"></div>

<div class="topbar">
  <div class="topbar-title" id="topbarTitle">Projects</div>
  <div class="topbar-right"  id="topbarRight"></div>
</div>

<!-- ═══ LIST VIEW ═══ -->
<div class="view active" id="viewList">
  <div class="list-toolbar">
    <div class="list-count" id="listCount">Loading...</div>
  </div>
  <div class="filter-tabs" id="filterTabs">
    <button class="filter-tab active" data-filter="all"              onclick="setFilter('all')">All</button>
    <button class="filter-tab"        data-filter="Needs Assignment" onclick="setFilter('Needs Assignment')">🔴 Needs Assignment</button>
    <button class="filter-tab"        data-filter="In Progress"      onclick="setFilter('In Progress')">In Progress</button>
    <button class="filter-tab"        data-filter="Completed"        onclick="setFilter('Completed')">Completed</button>
  </div>
  <div class="table-wrap">
    <table id="listTable">
      <thead>
        <tr>
          <th class="col-id">Quotation</th>
          <th>Client</th>
          <th>Project</th>
          <th class="col-date">Due Date</th>
          <th class="col-date">Deadline</th>
          <th class="col-status">Status</th>
          <th class="col-acts"></th>
        </tr>
      </thead>
      <tbody id="listBody">
        <tr><td colspan="7" style="text-align:center;padding:32px;color:#888;">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ═══ PROJECT DETAIL VIEW ═══ -->
<div class="view" id="viewProject">
  <div class="section" id="projectSummary"></div>
  <div class="section" id="projectProgress" style="padding:12px 18px;"></div>
  <div id="projectItems"></div>
</div>

<!-- ═══ FORM ACTIONS ═══ -->
<div class="form-actions hidden" id="formActions">
  <button class="btn btn-ghost" onclick="showList()">← Back</button>
  <div class="spacer"></div>
  <a id="deliverablesLink" class="deliverables-btn hidden" href="#" target="_blank">
    📦 Share Deliverables Folder
  </a>
</div>

<!-- ═══ REVIEW DIALOG ═══ -->
<div class="overlay" id="overlayReview">
  <div class="review-dialog">

    <!-- Header -->
    <div class="review-dialog-header">
      <h4 id="reviewTitle">Review Item</h4>
      <button class="review-dialog-close" onclick="closeReview()">×</button>
    </div>

    <!-- Select-all controls (only shown for approve mode) -->
    <div class="gallery-controls" id="galleryControls">
      <div class="gallery-controls-left">
        <label class="select-all-wrap" onclick="toggleSelectAll()">
          <input type="checkbox" id="chkSelectAll" onclick="event.stopPropagation();toggleSelectAll()">
          <span class="select-all-label">Select All</span>
        </label>
        <span class="selected-count-chip none" id="selectedCountChip">0 selected</span>
      </div>
      <span style="font-size:11px;color:#888;" id="galleryFileCount"></span>
    </div>

    <!-- Gallery -->
    <div class="gallery-wrap" id="galleryWrap">
      <div class="gallery-loading" id="galleryLoading">Loading previews…</div>
      <div class="gallery-grid hidden" id="galleryGrid"></div>
      <div class="gallery-empty hidden" id="galleryEmpty">No files to preview.</div>
    </div>

    <!-- Footer -->
    <div class="review-dialog-footer">
      <div id="reviewInfoBanner" class="review-info-banner approve hidden"></div>
      <div>
        <div class="review-notes-label">Internal Notes (optional)</div>
        <textarea class="review-notes" id="reviewNotes" placeholder="Add a note for the team…"></textarea>
      </div>
      <div class="review-btn-row">
        <button class="btn" onclick="closeReview()">Cancel</button>
        <button class="btn btn-danger  hidden" id="btnReviewReject"
                onclick="doReview('reject')">
          <div class="spinner"></div><span class="btn-label">Reject All Files</span>
        </button>
        <button class="btn btn-success hidden" id="btnReviewApprove"
                onclick="doReview('approve')" disabled>
          <div class="spinner"></div><span class="btn-label">Approve Selected</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ LIGHTBOX ═══ -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">×</button>
  <img class="lightbox-img" id="lightboxImg" src="" alt="">
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<script>
/* ══════════════════════════════
   STATE
══════════════════════════════ */
let allProjects      = [];
let currentProject   = null;
let currentItems     = [];
let currentFolderUrl = '';
let currentQuotationId = '';
let activeFilter     = 'all';
let reviewItemId     = null;
let reviewMode       = null;   // 'admin' | 'admin-reject' | 'client' | 'client-reject'
let currentUser      = null;
let reviewPreviews   = [];     // loaded previews for current review dialog
let selectedFileIds  = new Set();

const fileQueues = {};

/* ══════════════════════════════
   PROCESSING / TOAST
══════════════════════════════ */
function startProcessing(btn, msg) {
  document.getElementById('procBar').className = 'proc-bar active';
  showToast(msg || 'Loading…', 'info', 0);
  if (btn) { btn.classList.add('loading'); btn.disabled = true; }
}
function stopProcessing(btn) {
  const bar = document.getElementById('procBar');
  bar.className = 'proc-bar done';
  setTimeout(() => { bar.className = 'proc-bar'; }, 400);
  if (btn) { btn.classList.remove('loading'); btn.disabled = false; }
}
let toastTimer = null;
function showToast(msg, type, duration) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast toast-' + (type || 'info'); t.style.display = 'block';
  if (toastTimer) clearTimeout(toastTimer);
  if (duration !== 0) toastTimer = setTimeout(() => { t.style.display = 'none'; }, duration || 3500);
}
function hideToast() { document.getElementById('toast').style.display = 'none'; }

/* ══════════════════════════════
   INIT
══════════════════════════════ */
function init() {
  showToast('Loading…', 'info', 0);
  google.script.run
    .withSuccessHandler(user => {
      currentUser = user;
      renderUserChip(user);
      google.script.run
        .withSuccessHandler(renderList)
        .withFailureHandler(err => showToast('Load error: ' + err.message, 'error'))
        .getProjects();
    })
    .withFailureHandler(err => showAccessError(err.message))
    .getCurrentUser();
}

function renderUserChip(user) {
  const initials = (user.name || user.email).split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
  document.getElementById('topbarRight').innerHTML = `
    <div class="user-chip">
      <div class="user-avatar">${esc(initials)}</div>
      <span class="user-chip-name">${esc(user.name)}</span>
      <span class="user-chip-role">${esc(user.role)}</span>
    </div>`;
}

function showAccessError(msg) {
  document.getElementById('viewList').innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;text-align:center;padding:40px;">
      <div style="font-size:48px;margin-bottom:16px;">🔒</div>
      <h2 style="font-size:18px;font-weight:700;margin-bottom:8px;">Access Denied</h2>
      <p style="font-size:13px;color:#888;">${esc(msg)}</p>
    </div>`;
  hideToast();
}

/* ══════════════════════════════
   LIST VIEW
══════════════════════════════ */
function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.filter-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.filter === f));
  renderList(allProjects);
}

function renderList(projects) {
  allProjects = projects || [];
  hideToast();

  const filtered = activeFilter === 'all'
    ? allProjects
    : allProjects.filter(p => p.displayStatus === activeFilter);

  document.getElementById('listCount').textContent =
    filtered.length + ' project' + (filtered.length !== 1 ? 's' : '');

  const tbody = document.getElementById('listBody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:32px;color:#888;">No projects found.</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(p => {
    const dsKey = (p.displayStatus || '').toLowerCase().replace(/\s/g, '');
    const isFull = p.totalQty > 0 && p.assignedQty >= p.totalQty;
    const showChip = p.displayStatus === 'Needs Assignment' || p.displayStatus === 'In Progress';
    const chipHtml = showChip
      ? `<span class="assign-chip ${isFull ? 'full' : ''}">${p.assignedQty}/${p.totalQty} assigned</span>`
      : '';
    return `
    <tr onclick="openProject('${esc(p.projectId)}')">
      <td class="col-id">${esc(p.quotationId)}</td>
      <td><strong>${esc(p.accountName)}</strong></td>
      <td>${esc(p.projectName)}${chipHtml}</td>
      <td class="col-date">${p.dueDate || '—'}</td>
      <td class="col-date">${p.deliveryDeadline || '—'}</td>
      <td class="col-status"><span class="badge badge-${dsKey}">${esc(p.displayStatus)}</span></td>
      <td class="col-acts">
        <button class="btn-sm btn-sm-primary"
          onclick="event.stopPropagation();openProject('${esc(p.projectId)}')">Open →</button>
      </td>
    </tr>`;
  }).join('');
}

function showList() {
  switchView('list');
  document.getElementById('topbarTitle').textContent = 'Projects';
  renderUserChip(currentUser);
  document.getElementById('formActions').classList.add('hidden');
  document.getElementById('deliverablesLink').classList.add('hidden');
  google.script.run
    .withSuccessHandler(renderList)
    .withFailureHandler(err => showToast('Error: ' + err.message, 'error'))
    .getProjects();
}

/* ══════════════════════════════
   PROJECT DETAIL
══════════════════════════════ */
function openProject(projectId) {
  const p = allProjects.find(x => x.projectId === projectId);
  if (!p) return;
  currentProject = p;
  Object.keys(fileQueues).forEach(k => delete fileQueues[k]);
  startProcessing(null, 'Loading project…');
  google.script.run
    .withSuccessHandler(result => {
      stopProcessing(null); hideToast();
      currentItems       = result.items || [];
      currentFolderUrl   = result.folderUrl || '';
      currentQuotationId = result.quotationId || '';
      renderProjectDetail(p);
      switchView('project');
      document.getElementById('formActions').classList.remove('hidden');
      document.getElementById('topbarTitle').textContent = p.quotationId + ' — ' + p.projectName;
      renderUserChip(currentUser);

      if (currentQuotationId) {
        google.script.run
          .withSuccessHandler(r => {
            const dl = document.getElementById('deliverablesLink');
            if (r.success && r.url) { dl.href = r.url; dl.classList.remove('hidden'); }
          })
          .getDeliverablesUrl(currentQuotationId);
      }
    })
    .withFailureHandler(err => { stopProcessing(null); showToast('Error: ' + err.message, 'error'); })
    .getProjectItems(projectId);
}

function renderProjectDetail(p) {
  const dsKey = (p.displayStatus || '').toLowerCase().replace(/\s/g, '');
  document.getElementById('projectSummary').innerHTML = `
    <h3>Project Overview</h3>
    <div class="meta-grid">
      <div class="meta-cell"><div class="meta-label">Client</div><div class="meta-value">${esc(p.accountName)}</div></div>
      <div class="meta-cell"><div class="meta-label">Project</div><div class="meta-value">${esc(p.projectName)}</div></div>
      <div class="meta-cell"><div class="meta-label">Quotation</div><div class="meta-value">${esc(p.quotationId)}</div></div>
      <div class="meta-cell"><div class="meta-label">Due Date</div><div class="meta-value">${p.dueDate || '—'}</div></div>
      <div class="meta-cell"><div class="meta-label">Delivery Deadline</div><div class="meta-value">${p.deliveryDeadline || '—'}</div></div>
      <div class="meta-cell"><div class="meta-label">Status</div><div class="meta-value">
        <span class="badge badge-${dsKey}">${esc(p.displayStatus)}</span>
      </div></div>
      ${p.projectDesc ? `<div class="meta-cell" style="grid-column:1/-1;"><div class="meta-label">Description</div><div class="meta-value" style="font-weight:400;color:#555;">${esc(p.projectDesc)}</div></div>` : ''}
    </div>`;
  renderProgress();
  renderItems();
}

function renderProgress() {
  const total     = currentItems.length;
  const delivered = currentItems.filter(i => i.deliveryStatus === 'Delivered').length;
  const pct       = total ? Math.round((delivered / total) * 100) : 0;
  document.getElementById('projectProgress').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <span style="font-size:12px;font-weight:700;color:#4361ee;text-transform:uppercase;letter-spacing:0.05em;">Delivery Progress</span>
      <span style="font-size:12px;font-weight:600;color:#1e8a4a;">${delivered} / ${total} delivered</span>
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%;"></div></div>
    <div class="progress-label">${pct}% complete</div>`;
}

function renderItems() {
  const container = document.getElementById('projectItems');
  if (!currentItems.length) {
    container.innerHTML = `<div class="section" style="color:#888;text-align:center;padding:32px;">No items found for this project.</div>`;
    return;
  }
  container.innerHTML = currentItems.map(item => buildItemCard(item)).join('');
  currentItems.forEach(item => {
    if (canUploadItem(item.deliveryStatus)) wireUploadZone(item.itemId);
  });
}

function canUploadItem(status) {
  return ['Pending', 'Admin Rejected', 'Client Rejected'].includes(status);
}

/* ══════════════════════════════
   BUILD ITEM CARD
══════════════════════════════ */
function buildItemCard(item) {
  const statusKey   = (item.deliveryStatus || 'Pending').toLowerCase().replace(/\s/g, '');
  const statusLabel = item.deliveryStatus || 'Pending';
  const isAdmin = currentUser && currentUser.role === 'Admin';
  const isTeam  = currentUser && currentUser.role === 'Team';

  const canUpload       = canUploadItem(item.deliveryStatus) && (isTeam || isAdmin);
  const canAdminReview  = item.deliveryStatus === 'Uploaded' && isAdmin;
  const canClientReview = item.deliveryStatus === 'Admin Approved' && isAdmin;

  let metaPills = `<div class="meta-pill"><span class="pill-label">Qty</span><span class="pill-value">${esc(String(item.quantity || '—'))}</span></div>`;
  if (item.dueDate)     metaPills += `<div class="meta-pill"><span class="pill-label">Due</span><span class="pill-value">${esc(item.dueDate)}</span></div>`;
  if (item.redoCount > 0) metaPills += `<div class="meta-pill" style="background:#fff8ee;border:1px solid #f0d090;"><span class="pill-label" style="color:#a07000;">Redos</span><span class="pill-value" style="color:#7a4500;">↩ ${item.redoCount}</span></div>`;
  if (item.description) metaPills += `<div class="meta-pill" style="flex:1;min-width:160px;"><span class="pill-label">Description</span><span class="pill-value" style="font-weight:400;color:#444;">${esc(item.description)}</span></div>`;
  if (item.notes)       metaPills += `<div class="meta-pill notes-pill" style="flex:1;min-width:160px;"><span class="pill-label">Notes</span><span class="pill-value">${esc(item.notes)}</span></div>`;

  let existingFilesHtml = '';
  const showRawLinks = item.uploadedFileUrl
    && !['Admin Rejected', 'Client Rejected'].includes(item.deliveryStatus)
    && !canAdminReview && !canClientReview;
  if (showRawLinks) {
    const urls = item.uploadedFileUrl.split('\n').map(s => s.trim()).filter(Boolean);
    if (urls.length === 1)
      existingFilesHtml = `<a class="file-link" href="${esc(urls[0])}" target="_blank">📄 View Uploaded File ↗</a>`;
    else if (urls.length > 1)
      existingFilesHtml = `<span style="font-size:12px;color:#666;font-weight:600;">📄 ${urls.length} files uploaded</span>`;
  }

  const adminReviewHtml = canAdminReview ? `
    <button class="btn-sm btn-sm-success" onclick="openReview('${esc(item.itemId)}','admin')">
      🖼 Review Files
    </button>
    <button class="btn-sm btn-sm-danger" onclick="openReview('${esc(item.itemId)}','admin-reject')">
      ✗ Reject
    </button>` : '';

  const clientReviewHtml = canClientReview ? `
    <button class="btn-sm btn-sm-primary" onclick="openReview('${esc(item.itemId)}','client')">
      ✓ Client Approve
    </button>
    <button class="btn-sm btn-sm-warning" onclick="openReview('${esc(item.itemId)}','client-reject')">
      ✗ Client Reject
    </button>` : '';

  const uploadAreaHtml = canUpload ? `
    <div class="upload-area" id="uploadArea-${esc(item.itemId)}">
      <div class="qty-requirement" id="qtyReq-${esc(item.itemId)}">
        📋 ${item.quantity} file${item.quantity !== 1 ? 's' : ''} required for this item
      </div>
      <div class="upload-zone" id="zone-${esc(item.itemId)}"
           ondragover="onDragOver(event,'${esc(item.itemId)}')"
           ondragleave="onDragLeave(event,'${esc(item.itemId)}')"
           ondrop="onDrop(event,'${esc(item.itemId)}')">
        <input type="file" id="fileInput-${esc(item.itemId)}" multiple
               onchange="onFilesSelected('${esc(item.itemId)}', this.files)">
        <input type="file" id="dirInput-${esc(item.itemId)}" webkitdirectory mozdirectory
               onchange="onFilesSelected('${esc(item.itemId)}', this.files)">
        <span class="upload-zone-icon">📂</span>
        <div>Drag &amp; drop files or a folder here</div>
        <div class="upload-zone-hint">Supports multiple files at once</div>
        <div class="upload-trigger-btns">
          <button class="upload-trigger-btn"
            onclick="event.stopPropagation();document.getElementById('fileInput-${esc(item.itemId)}').click()">
            📄 Select Files
          </button>
          <button class="upload-trigger-btn"
            onclick="event.stopPropagation();document.getElementById('dirInput-${esc(item.itemId)}').click()">
            📁 Select Folder
          </button>
        </div>
      </div>
      <div class="file-queue" id="queue-${esc(item.itemId)}">
        <div class="file-queue-header">
          <span id="queueLabel-${esc(item.itemId)}">0 files queued</span>
          <button class="file-queue-clear" onclick="clearQueue('${esc(item.itemId)}')">Clear all</button>
        </div>
        <div class="file-queue-list" id="queueList-${esc(item.itemId)}"></div>
      </div>
      <div class="upload-progress-wrap" id="uploadProgress-${esc(item.itemId)}">
        <div class="upload-progress-bar-bg">
          <div class="upload-progress-bar-fill" id="uploadProgressFill-${esc(item.itemId)}" style="width:0%;"></div>
        </div>
        <div class="upload-progress-label" id="uploadProgressLabel-${esc(item.itemId)}"></div>
      </div>
      <div class="upload-submit-row">
        <button class="btn btn-primary" id="uploadBtn-${esc(item.itemId)}" disabled
                onclick="submitUpload('${esc(item.itemId)}', ${Number(item.quantity)})">
          <div class="spinner"></div>
          <span class="btn-label">Upload Files</span>
        </button>
        <span class="upload-count-label" id="uploadCountLabel-${esc(item.itemId)}"></span>
      </div>
    </div>` : '';

  const internalNotesHtml = item.internalNotes ? `
    <div style="margin-top:10px;">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#888;margin-bottom:4px;">Internal Notes</div>
      <div style="font-size:12px;color:#555;padding:6px 10px;background:#f8f9ff;border-radius:4px;border-left:3px solid #4361ee;">${esc(item.internalNotes)}</div>
    </div>` : '';

  return `
  <div class="section item-card" id="card-${esc(item.itemId)}">
    <div class="item-header">
      <div class="item-name">${esc(item.itemName)}</div>
      <span class="badge badge-${statusKey}">${esc(statusLabel)}</span>
    </div>
    <div class="item-meta">${metaPills}</div>
    <div class="item-actions">
      ${existingFilesHtml}
      ${adminReviewHtml}
      ${clientReviewHtml}
    </div>
    ${uploadAreaHtml}
    ${internalNotesHtml}
  </div>`;
}

/* ══════════════════════════════
   REVIEW DIALOG — open
══════════════════════════════ */
function openReview(itemId, mode) {
  reviewItemId    = itemId;
  reviewMode      = mode;
  reviewPreviews  = [];
  selectedFileIds = new Set();

  const item     = currentItems.find(i => i.itemId === itemId);
  const isReject = mode === 'admin-reject' || mode === 'client-reject';
  const isAdmin  = mode === 'admin' || mode === 'admin-reject';
  const isApproveMode = mode === 'admin' || mode === 'client';

  // Title
  let title = '';
  if (mode === 'admin')         title = '🖼 Admin Review — ' + (item ? item.itemName : '');
  if (mode === 'admin-reject')  title = '✗ Reject Item — '   + (item ? item.itemName : '');
  if (mode === 'client')        title = '✓ Client Approval — '+ (item ? item.itemName : '');
  if (mode === 'client-reject') title = '✗ Client Reject — '  + (item ? item.itemName : '');
  document.getElementById('reviewTitle').textContent = title;

  // Notes
  document.getElementById('reviewNotes').value = item ? (item.internalNotes || '') : '';

  // Show/hide select-all controls
  document.getElementById('galleryControls').style.display = isApproveMode ? 'flex' : 'none';

  // Info banner
  const banner = document.getElementById('reviewInfoBanner');
  if (isApproveMode) {
    banner.className = 'review-info-banner approve';
    banner.textContent = mode === 'admin'
      ? 'Select the files you want to copy to Deliverables, then click Approve Selected.'
      : 'All files in Deliverables will be marked as delivered for the client.';
    banner.classList.remove('hidden');
  } else {
    banner.className = 'review-info-banner reject';
    banner.textContent = isAdmin
      ? 'All uploaded files will be moved to Rejected and the team will need to re-upload.'
      : 'Files will be moved from Deliverables to Archived and the team will need to redo.';
    banner.classList.remove('hidden');
  }

  // Buttons
  const btnApprove = document.getElementById('btnReviewApprove');
  const btnReject  = document.getElementById('btnReviewReject');
  if (isReject) {
    btnApprove.classList.add('hidden');
    btnReject.classList.remove('hidden');
    btnReject.querySelector('.btn-label').textContent = isAdmin ? 'Reject — Move to Rejected' : 'Client Reject — Archive';
  } else {
    btnReject.classList.add('hidden');
    btnApprove.classList.remove('hidden');
    btnApprove.disabled = true; // enabled after selection
    btnApprove.querySelector('.btn-label').textContent =
      mode === 'admin' ? 'Approve Selected' : 'Mark as Delivered';
  }

  document.getElementById('overlayReview').classList.add('open');
  loadGallery(itemId, isApproveMode);
}

/* ══════════════════════════════
   GALLERY LOAD
══════════════════════════════ */
function loadGallery(itemId, selectable) {
  const grid    = document.getElementById('galleryGrid');
  const loading = document.getElementById('galleryLoading');
  const empty   = document.getElementById('galleryEmpty');

  grid.classList.add('hidden');
  empty.classList.add('hidden');
  loading.classList.remove('hidden');
  document.getElementById('galleryFileCount').textContent = '';
  updateSelectionUI();

  google.script.run
    .withSuccessHandler(previews => {
      loading.classList.add('hidden');
      reviewPreviews = previews || [];

      if (!reviewPreviews.length) {
        empty.classList.remove('hidden');
        document.getElementById('galleryFileCount').textContent = 'No files uploaded.';
        return;
      }

      document.getElementById('galleryFileCount').textContent =
        reviewPreviews.length + ' file' + (reviewPreviews.length !== 1 ? 's' : '');

      // For approve mode: start with ALL selected
      if (selectable) {
        reviewPreviews.forEach(f => selectedFileIds.add(f.fileId));
      }

      grid.innerHTML = reviewPreviews.map(f => buildGalleryCard(f, selectable)).join('');
      grid.classList.remove('hidden');
      updateSelectionUI();
    })
    .withFailureHandler(err => {
      loading.classList.add('hidden');
      empty.classList.remove('hidden');
      empty.textContent = 'Could not load previews: ' + err.message;
    })
    .getItemFilePreviews(itemId);
}

function buildGalleryCard(f, selectable) {
  const thumb = f.isImage
    ? `<img class="gallery-thumb" src="${esc(f.thumbUrl)}" alt="${esc(f.name)}"
            onclick="${selectable ? 'toggleFileSelect(event,\'' + esc(f.fileId) + '\')' : 'openLightbox(\'' + esc(f.thumbUrl) + '\',\'' + esc(f.name) + '\')'}"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    + `<div class="gallery-thumb-placeholder" style="display:none;">🖼</div>`
    : f.isVideo
      ? `<div class="gallery-thumb-placeholder" style="background:#1a1a2e;color:#fff;flex-direction:column;gap:6px;">
           <span style="font-size:36px;">▶</span>
           <span style="font-size:11px;color:#aaa;">VIDEO</span>
         </div>`
      : `<div class="gallery-thumb-placeholder">📄</div>`;

  const checkHtml = selectable ? `
    <div class="gallery-check-wrap">
      <div class="gallery-check" id="check-${esc(f.fileId)}"></div>
    </div>` : '';

  const clickHandler = selectable
    ? `onclick="toggleFileSelect(event,'${esc(f.fileId)}')" style="cursor:pointer;"`
    : '';

  return `
    <div class="gallery-item ${f.isVideo ? 'is-video' : ''}" id="gitem-${esc(f.fileId)}" ${clickHandler}>
      ${checkHtml}
      ${thumb}
      <div class="gallery-item-info">
        <div class="gallery-item-name" title="${esc(f.name)}">${esc(f.name)}</div>
        <div class="gallery-item-type">${esc(f.isImage ? 'Image' : f.isVideo ? 'Video' : f.mimeType.split('/').pop() || 'File')}</div>
        <a class="gallery-item-open" href="${esc(f.viewUrl)}" target="_blank"
           onclick="event.stopPropagation()">Open in Drive ↗</a>
      </div>
    </div>`;
}

/* ══════════════════════════════
   FILE SELECTION
══════════════════════════════ */
function toggleFileSelect(event, fileId) {
  event.stopPropagation();
  if (selectedFileIds.has(fileId)) {
    selectedFileIds.delete(fileId);
  } else {
    selectedFileIds.add(fileId);
  }
  updateFileCardState(fileId);
  updateSelectionUI();
}

function toggleSelectAll() {
  const allSelected = selectedFileIds.size === reviewPreviews.length;
  selectedFileIds = new Set();
  if (!allSelected) {
    reviewPreviews.forEach(f => selectedFileIds.add(f.fileId));
  }
  reviewPreviews.forEach(f => updateFileCardState(f.fileId));
  updateSelectionUI();
}

function updateFileCardState(fileId) {
  const card  = document.getElementById('gitem-' + fileId);
  const check = document.getElementById('check-' + fileId);
  if (!card) return;
  const sel = selectedFileIds.has(fileId);
  card.classList.toggle('selected', sel);
  if (check) check.classList.toggle('selected', sel); // triggers CSS ::after
}

function updateSelectionUI() {
  const total    = reviewPreviews.length;
  const selCount = selectedFileIds.size;
  const chip     = document.getElementById('selectedCountChip');
  const chkAll   = document.getElementById('chkSelectAll');
  const btnApprove = document.getElementById('btnReviewApprove');

  if (chip) {
    chip.textContent = selCount + ' selected';
    chip.className   = 'selected-count-chip' + (selCount === 0 ? ' none' : '');
  }
  if (chkAll) {
    chkAll.checked       = total > 0 && selCount === total;
    chkAll.indeterminate = selCount > 0 && selCount < total;
  }
  // Enable Approve only when ≥1 file selected
  const isApproveMode = reviewMode === 'admin' || reviewMode === 'client';
  if (btnApprove && isApproveMode) {
    btnApprove.disabled = selCount === 0;
  }
}

/* ══════════════════════════════
   CLOSE REVIEW
══════════════════════════════ */
function closeReview() {
  document.getElementById('overlayReview').classList.remove('open');
  reviewItemId    = null;
  reviewMode      = null;
  reviewPreviews  = [];
  selectedFileIds = new Set();
}

/* ══════════════════════════════
   DO REVIEW — submit
══════════════════════════════ */
function doReview(action) {
  const isReject = reviewMode === 'admin-reject' || reviewMode === 'client-reject';
  const isAdmin  = reviewMode === 'admin' || reviewMode === 'admin-reject';
  const notes    = document.getElementById('reviewNotes').value;
  const btn      = isReject
    ? document.getElementById('btnReviewReject')
    : document.getElementById('btnReviewApprove');

  // Validate selection for approve
  if (!isReject && selectedFileIds.size === 0) {
    showToast('Please select at least one file to approve.', 'error');
    return;
  }

  const params = {
    itemId:         reviewItemId,
    action,
    internalNotes:  notes,
    selectedFileIds: isReject ? [] : Array.from(selectedFileIds)
  };

  closeReview();
  startProcessing(btn, isReject ? 'Rejecting…' : 'Approving…');

  const fn = isAdmin ? 'reviewProjectItem' : 'clientReviewItem';
  google.script.run
    .withSuccessHandler(res => {
      stopProcessing(btn);
      if (!res.success) {
        showToast('Error: ' + (res.error || 'Action failed.'), 'error');
        return;
      }
      showToast(
        isReject
          ? '✗ Item rejected.'
          : (isAdmin ? '✓ Files approved and copied to Deliverables.' : '✓ Item marked as delivered.'),
        isReject ? 'error' : 'success'
      );
      refreshItems();
    })
    .withFailureHandler(err => {
      stopProcessing(btn);
      showToast('Error: ' + err.message, 'error');
    })
    [fn](params);
}

/* ══════════════════════════════
   UPLOAD ZONE
══════════════════════════════ */
function wireUploadZone(itemId) { /* drag events handled inline */ }

function onDragOver(e, itemId) {
  e.preventDefault();
  document.getElementById('zone-' + itemId).classList.add('drag-over');
}
function onDragLeave(e, itemId) {
  document.getElementById('zone-' + itemId).classList.remove('drag-over');
}
function onDrop(e, itemId) {
  e.preventDefault();
  document.getElementById('zone-' + itemId).classList.remove('drag-over');
  const items = e.dataTransfer.items;
  if (items) {
    const filePromises = [];
    for (let i = 0; i < items.length; i++) {
      const entry = items[i].webkitGetAsEntry ? items[i].webkitGetAsEntry() : null;
      if (entry) filePromises.push(traverseEntry(entry));
      else if (items[i].kind === 'file') {
        const f = items[i].getAsFile();
        if (f) filePromises.push(Promise.resolve([f]));
      }
    }
    Promise.all(filePromises).then(arrays => {
      registerFiles(itemId, [].concat(...arrays).filter(Boolean));
    });
  } else {
    registerFiles(itemId, Array.from(e.dataTransfer.files));
  }
}

function traverseEntry(entry) {
  return new Promise(resolve => {
    if (entry.isFile) {
      entry.file(f => resolve([f]), () => resolve([]));
    } else if (entry.isDirectory) {
      const reader  = entry.createReader();
      const results = [];
      function readBatch() {
        reader.readEntries(entries => {
          if (!entries.length) {
            Promise.all(results).then(arrays => resolve([].concat(...arrays)));
            return;
          }
          entries.forEach(e => results.push(traverseEntry(e)));
          readBatch();
        }, () => resolve([]));
      }
      readBatch();
    } else { resolve([]); }
  });
}

function onFilesSelected(itemId, fileList) {
  if (!fileList || !fileList.length) return;
  registerFiles(itemId, Array.from(fileList));
  const fi = document.getElementById('fileInput-' + itemId);
  const di = document.getElementById('dirInput-'  + itemId);
  if (fi) fi.value = '';
  if (di) di.value = '';
}

function registerFiles(itemId, newFiles) {
  if (!newFiles.length) return;
  if (!fileQueues[itemId]) fileQueues[itemId] = [];
  const existing = new Set(fileQueues[itemId].map(f => f.name + '|' + f.size));
  fileQueues[itemId].push(...newFiles.filter(f => !existing.has(f.name + '|' + f.size)));
  refreshQueueUI(itemId);
}

function refreshQueueUI(itemId) {
  const queue   = fileQueues[itemId] || [];
  const queueEl = document.getElementById('queue-'            + itemId);
  const listEl  = document.getElementById('queueList-'        + itemId);
  const labelEl = document.getElementById('queueLabel-'       + itemId);
  const countEl = document.getElementById('uploadCountLabel-' + itemId);
  const btnEl   = document.getElementById('uploadBtn-'        + itemId);
  const reqEl   = document.getElementById('qtyReq-'           + itemId);
  if (!queueEl) return;

  const item     = currentItems.find(i => i.itemId === itemId);
  const required = item ? Number(item.quantity) : 0;

  if (!queue.length) {
    queueEl.classList.remove('has-files');
    if (btnEl) btnEl.disabled = true;
    if (countEl) countEl.textContent = '';
    if (reqEl) { reqEl.className = 'qty-requirement'; reqEl.textContent = `📋 ${required} file${required !== 1 ? 's' : ''} required`; }
    return;
  }

  queueEl.classList.add('has-files');
  labelEl.textContent = queue.length + ' file' + (queue.length !== 1 ? 's' : '') + ' queued';

  if (reqEl) {
    if (queue.length === required) {
      reqEl.className = 'qty-requirement met';
      reqEl.textContent = `✓ ${queue.length} / ${required} files — ready to upload`;
    } else if (queue.length > required) {
      reqEl.className = 'qty-requirement over';
      reqEl.textContent = `⚠ ${queue.length} queued but ${required} required — remove ${queue.length - required}`;
    } else {
      reqEl.className = 'qty-requirement';
      reqEl.textContent = `📋 ${queue.length} / ${required} files queued — need ${required - queue.length} more`;
    }
  }

  if (btnEl) btnEl.disabled = (queue.length !== required);
  if (countEl) {
    countEl.textContent = queue.length === required
      ? `${queue.length} file${queue.length !== 1 ? 's' : ''} ready`
      : (queue.length > required ? `Too many (need exactly ${required})` : `Need ${required - queue.length} more`);
  }

  listEl.innerHTML = queue.map((f, i) => `
    <div class="file-queue-item">
      <span class="file-queue-name" title="${esc(f.name)}">📄 ${esc(f.name)}</span>
      <span class="file-queue-size">${formatBytes(f.size)}</span>
      <button class="file-queue-remove"
        onclick="removeFromQueue('${esc(itemId)}', ${i})" title="Remove">✕</button>
    </div>`).join('');
}

function removeFromQueue(itemId, index) { if (!fileQueues[itemId]) return; fileQueues[itemId].splice(index, 1); refreshQueueUI(itemId); }
function clearQueue(itemId) { fileQueues[itemId] = []; refreshQueueUI(itemId); }

/* ══════════════════════════════
   UPLOAD EXECUTION
══════════════════════════════ */
function submitUpload(itemId, requiredQty) {
  const queue = fileQueues[itemId];
  if (!queue || !queue.length) return;
  if (queue.length !== requiredQty) {
    showToast(queue.length > requiredQty
      ? `Too many files. This item requires exactly ${requiredQty}.`
      : `Need ${requiredQty} files (you have ${queue.length}).`, 'error');
    return;
  }

  const btn          = document.getElementById('uploadBtn-'          + itemId);
  const progressWrap = document.getElementById('uploadProgress-'     + itemId);
  const progressFill = document.getElementById('uploadProgressFill-' + itemId);
  const progressLbl  = document.getElementById('uploadProgressLabel-'+ itemId);

  btn.disabled = true; btn.classList.add('loading');
  progressWrap.classList.add('active');
  progressFill.style.width = '0%';

  const total = queue.length;
  let done = 0, failed = 0;
  const filesToUpload = queue.slice();

  function uploadNext(index) {
    if (index >= filesToUpload.length) {
      btn.classList.remove('loading');
      progressFill.style.width = '100%';
      if (failed === 0) {
        progressLbl.textContent = '✓ All ' + total + ' file' + (total > 1 ? 's' : '') + ' uploaded!';
        showToast('Uploaded ' + total + ' file' + (total > 1 ? 's' : '') + ' successfully!', 'success');
      } else {
        progressLbl.textContent = (done - failed) + ' of ' + total + ' uploaded. ' + failed + ' failed.';
        showToast(failed + ' file(s) failed.', 'error');
      }
      fileQueues[itemId] = [];
      refreshQueueUI(itemId);
      setTimeout(() => {
        progressWrap.classList.remove('active');
        progressFill.style.width = '0%';
        btn.disabled = false;
        refreshItems();
      }, 2000);
      return;
    }

    const file = filesToUpload[index];
    progressLbl.textContent = 'Uploading ' + (index + 1) + ' / ' + total + ': ' + file.name;
    progressFill.style.width = Math.round((index / total) * 100) + '%';

    const reader = new FileReader();
    reader.onload = function(e) {
      const base64 = e.target.result.split(',')[1];
      google.script.run
        .withSuccessHandler(res => { done++; if (!res.success) failed++; uploadNext(index + 1); })
        .withFailureHandler(() => { done++; failed++; uploadNext(index + 1); })
        .uploadProjectItemFile({
          itemId, projectId: currentProject.projectId,
          fileName: file.name, mimeType: file.type || 'application/octet-stream', base64Data: base64
        });
    };
    reader.onerror = () => { done++; failed++; uploadNext(index + 1); };
    reader.readAsDataURL(file);
  }

  startProcessing(null, 'Uploading ' + total + ' file' + (total > 1 ? 's' : '') + '…');
  uploadNext(0);
}

/* ══════════════════════════════
   REFRESH ITEMS
══════════════════════════════ */
function refreshItems() {
  google.script.run
    .withSuccessHandler(result => {
      currentItems       = result.items || [];
      currentFolderUrl   = result.folderUrl || '';
      currentQuotationId = result.quotationId || '';
      renderProgress();
      renderItems();
      google.script.run
        .withSuccessHandler(projects => { allProjects = projects || []; })
        .getProjects();
    })
    .withFailureHandler(err => showToast('Refresh error: ' + err.message, 'error'))
    .getProjectItems(currentProject.projectId);
}

/* ══════════════════════════════
   HELPERS
══════════════════════════════ */
function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;')
    .replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
